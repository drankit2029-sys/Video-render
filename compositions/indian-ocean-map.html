<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Indian Ocean Map Block</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
  <!-- Pre-cached local TopoJSON generated by GitHub Actions (falls back to CDN in local browser) -->
  <script src="../topo-data.js" onerror="window.__USE_CDN_TOPO = true;"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { background: #021a13; font-family: 'Montserrat', sans-serif; overflow: hidden; }

    #indian-ocean-map {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #06382c 0%, #021610 100%);
      perspective: 1500px;
    }

    /* Background Grid visible behind the 3D tilted world card at 00:11 - 00:15 */
    .bg-perspective-grid {
      position: absolute;
      inset: -300px;
      background-image:
        linear-gradient(rgba(74, 222, 128, 0.18) 2px, transparent 2px),
        linear-gradient(90deg, rgba(74, 222, 128, 0.18) 2px, transparent 2px);
      background-size: 84px 84px;
    }

    /* 2400x1200 Equirectangular World Stage */
    #camera-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2400px;
      height: 1200px;
      margin-left: -1200px;
      margin-top: -600px;
      transform-origin: 1200px 600px;
      transform-style: preserve-3d;
      will-change: transform, filter;
      background: radial-gradient(ellipse at 65% 60%, #0a5c46 0%, #063e2f 55%, #04281e 100%);
      overflow: hidden;
    }

    /* White 3D Card Border — ONLY visible during the 3D World Card pullback (11.1s - 15.0s) */
    #card-frame-border {
      position: absolute;
      inset: 0;
      border: 10px solid #ffffff;
      box-shadow: 0 60px 140px rgba(0, 0, 0, 0.9);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
    }

    #map-svg {
      position: absolute;
      inset: 0;
      width: 2400px;
      height: 1200px;
      overflow: visible;
    }

    .neon-gold-text {
      fill: #ffea00;
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.95)) drop-shadow(0 5px 12px rgba(0, 0, 0, 0.9));
    }

    /* 3D Arched INDIAN OCEAN Title Overlay */
    #hud-title-group {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 960px;
      height: 420px;
      margin-left: -480px;
      margin-top: -210px;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
    }

    /* 14% Counter (Positioned below tilted 3D world map at 11.2s - 15.0s) */
    #hud-14-percent {
      position: absolute;
      bottom: 300px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 120px;
      font-weight: 900;
      color: #ffea00;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.95), 0 12px 28px rgba(0, 0, 0, 0.95);
      opacity: 0;
      transform: rotate(-11deg);
      pointer-events: none;
      z-index: 15;
    }
  </style>
</head>
<body>

  <div
    id="indian-ocean-map"
    class="clip"
    data-composition-id="indian-ocean-map"
    data-width="1080"
    data-height="1920"
    data-fps="60"
    data-duration="28">

    <!-- SVG Filters & Gradients -->
    <svg width="0" height="0" style="position:absolute;">
      <defs>
        <filter id="hf-motion-blur" x="-25%" y="-25%" width="150%" height="150%">
          <feGaussianBlur id="blur-kernel" in="SourceGraphic" stdDeviation="0,0" />
        </filter>
        <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="5" result="b1" />
          <feGaussianBlur stdDeviation="14" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="coastal-shelf" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="8" result="shelfBlur" />
        </filter>
      </defs>
    </svg>

    <!-- Background Dark Emerald Grid -->
    <div class="bg-perspective-grid"></div>

    <!-- 3D Camera Stage -->
    <div id="camera-stage" style="filter: url(#hf-motion-blur);">
      <div id="card-frame-border"></div>

      <svg id="map-svg" viewBox="0 0 2400 1200">
        <defs>
          <!-- Satellite-Styled Landmass Topographic Gradient -->
          <linearGradient id="land-terrain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3a6b4c" />
            <stop offset="35%" stop-color="#4f7d4e" />
            <stop offset="65%" stop-color="#2f5c3f" />
            <stop offset="100%" stop-color="#1e422b" />
          </linearGradient>

          <!-- Clip Path for the Indian Ocean Basin Measurement Grid -->
          <clipPath id="basin-clip">
            <path id="basin-clip-path" />
          </clipPath>

          <!-- Crisp Contiguous US Flag Fill Pattern -->
          <pattern id="us-flag-pattern" viewBox="0 0 190 100" width="100%" height="100%" preserveAspectRatio="none">
            <rect width="190" height="100" fill="#ffffff"/>
            <g fill="#d21034">
              <rect y="0" width="190" height="7.69"/><rect y="15.38" width="190" height="7.69"/>
              <rect y="30.77" width="190" height="7.69"/><rect y="46.15" width="190" height="7.69"/>
              <rect y="61.54" width="190" height="7.69"/><rect y="76.92" width="190" height="7.69"/>
              <rect y="92.31" width="190" height="7.69"/>
            </g>
            <rect width="78" height="53.85" fill="#002868"/>
            <g fill="#ffffff">
              <circle cx="13" cy="11" r="2.8"/><circle cx="29" cy="11" r="2.8"/><circle cx="45" cy="11" r="2.8"/><circle cx="61" cy="11" r="2.8"/>
              <circle cx="21" cy="21" r="2.8"/><circle cx="37" cy="21" r="2.8"/><circle cx="53" cy="21" r="2.8"/><circle cx="69" cy="21" r="2.8"/>
              <circle cx="13" cy="31" r="2.8"/><circle cx="29" cy="31" r="2.8"/><circle cx="45" cy="31" r="2.8"/><circle cx="61" cy="31" r="2.8"/>
              <circle cx="21" cy="41" r="2.8"/><circle cx="37" cy="41" r="2.8"/><circle cx="53" cy="41" r="2.8"/><circle cx="69" cy="41" r="2.8"/>
            </g>
          </pattern>

          <!-- Photorealistic Vector Moon Texture Symbol (Zero Broken Image Risk) -->
          <radialGradient id="lunar-sphere" cx="38%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="45%" stop-color="#cbd5e1" />
            <stop offset="82%" stop-color="#64748b" />
            <stop offset="100%" stop-color="#1e293b" />
          </radialGradient>

          <g id="vector-moon">
            <!-- Drop Shadow -->
            <circle r="54" cx="6" cy="10" fill="rgba(0,0,0,0.65)" filter="blur(6px)" />
            <!-- Base Lunar Sphere -->
            <circle r="52" fill="url(#lunar-sphere)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" />
            <!-- Authentic Lunar Maria (Dark Basalt Plains) -->
            <path d="M-28,-18 C-15,-32 8,-26 14,-10 C20,5 4,18 -14,12 C-28,6 -36,-6 -28,-18 Z" fill="rgba(51,65,85,0.42)" />
            <path d="M12,-24 C24,-22 36,-8 30,8 C24,22 8,16 6,2 C4,-10 4,-25 12,-24 Z" fill="rgba(51,65,85,0.35)" />
            <path d="M-18,16 C-6,12 14,18 22,28 C12,38 -10,38 -22,28 Z" fill="rgba(51,65,85,0.30)" />
            <!-- High-Contrast Impact Craters & Tycho Rays -->
            <circle cx="-12" cy="-14" r="9" fill="rgba(71,85,105,0.35)" stroke="rgba(248,250,252,0.5)" stroke-width="1" />
            <circle cx="18" cy="-6" r="11" fill="rgba(51,65,85,0.38)" stroke="rgba(248,250,252,0.4)" stroke-width="1" />
            <circle cx="-22" cy="12" r="7" fill="rgba(71,85,105,0.4)" stroke="rgba(248,250,252,0.45)" stroke-width="0.8" />
            <circle cx="6" cy="24" r="6" fill="rgba(241,245,249,0.65)" stroke="rgba(255,255,255,0.8)" stroke-width="1.2" />
            <circle cx="-6" cy="4" r="4.5" fill="rgba(100,116,139,0.4)" />
            <circle cx="24" cy="16" r="5" fill="rgba(71,85,105,0.45)" />
          </g>
        </defs>

        <!-- LAYER 1: Subtle Ocean Graticule Lines -->
        <path id="graticule-path" fill="none" stroke="rgba(110, 231, 183, 0.12)" stroke-width="1" />

        <!-- LAYER 2: Indian Ocean Basin Fill & Measurement Grid (Sits UNDER continents so coastlines are 100% exact!) -->
        <g id="basin-underlay" opacity="0">
          <path id="basin-fill" fill="rgba(16, 185, 129, 0.34)" />
          <g id="basin-grid" clip-path="url(#basin-clip)" opacity="0"></g>
        </g>

        <!-- LAYER 3: Turquoise Shallow Coastal Shelf Glow -->
        <path id="coastal-glow-path" fill="none" stroke="rgba(45, 212, 191, 0.35)" stroke-width="8" filter="url(#coastal-shelf)" />

        <!-- LAYER 4: All World Continents & Country Borders (Always Visible!) -->
        <g id="countries-layer"></g>

        <!-- LAYER 5: Glowing Neon Gold Indian Ocean Perimeter Outline -->
        <path
          id="basin-stroke"
          fill="none"
          stroke="#ffea00"
          stroke-width="4.5"
          stroke-linejoin="round"
          stroke-linecap="round"
          filter="url(#gold-glow)"
          opacity="0"
        />

        <!-- LAYER 6: Scene 2A "3rd" Largest Ocean (5.2s - 7.5s) -->
        <g id="label-3rd" opacity="0" transform="translate(1720, 720)">
          <text class="neon-gold-text" font-size="68" text-anchor="middle" y="0">
            3<tspan font-size="38" dy="-26">rd</tspan>
          </text>
        </g>

        <!-- LAYER 7: Scene 2B "70.56 Million Sq. Kms" Counter (7.5s - 11.1s) -->
        <g id="label-area" opacity="0" transform="translate(1705, 725)">
          <text id="area-counter" class="neon-gold-text" font-size="52" text-anchor="end" x="10" y="0">0.00</text>
          <text class="neon-gold-text" font-size="22" text-anchor="start" x="22" y="-22">Million</text>
          <text class="neon-gold-text" font-size="22" text-anchor="start" x="22" y="2">Sq. Kms</text>
        </g>

        <!-- LAYER 8: Scene 4 — 7x Contiguous United States Flag Cutouts (15.1s - 20.0s) -->
        <g id="us-cutouts-group"></g>

        <!-- LAYER 9: Scene 5 — Asia 1.5x Neon Gold Choropleth (20.0s - 24.2s) -->
        <g id="asia-highlight-group" opacity="0" filter="url(#gold-glow)"></g>
        <g id="label-asia-15x" opacity="0" transform="translate(1830, 905)">
          <text id="asia-counter" class="neon-gold-text" font-size="58" text-anchor="middle">0.00x</text>
        </g>

        <!-- LAYER 10: Scene 6 — Double Moon Comparison inside Indian Ocean (24.2s - 28.0s) -->
        <g id="moons-group" transform="translate(1720, 725)">
          <g id="moon-left" transform="translate(-72, 0) scale(0)">
            <use href="#vector-moon" />
          </g>
          <g id="moon-right" transform="translate(72, 0) scale(0)">
            <use href="#vector-moon" />
          </g>
        </g>

      </svg>
    </div>

    <!-- Screen-Space 3D Arched "INDIAN OCEAN" Title (Locked to Viewport Center, 0.0s - 4.9s) -->
    <svg id="hud-title-group" viewBox="0 0 960 420">
      <defs>
        <path id="title-arc-1" d="M 80,210 Q 480,120 880,210" />
        <path id="title-arc-2" d="M 120,335 Q 480,255 840,335" />
      </defs>
      <!-- 3D Extruded Shadow Layer -->
      <g fill="#0f172a" opacity="0.85" transform="translate(6, 12)">
        <text font-size="118" font-weight="900" letter-spacing="8" text-anchor="middle">
          <textPath href="#title-arc-1" startOffset="50%">INDIAN</textPath>
        </text>
        <text font-size="118" font-weight="900" letter-spacing="8" text-anchor="middle">
          <textPath href="#title-arc-2" startOffset="50%">OCEAN</textPath>
        </text>
      </g>
      <!-- Crisp White Face Layer -->
      <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2">
        <text font-size="118" font-weight="900" letter-spacing="8" text-anchor="middle">
          <textPath href="#title-arc-1" startOffset="50%">INDIAN</textPath>
        </text>
        <text font-size="118" font-weight="900" letter-spacing="8" text-anchor="middle">
          <textPath href="#title-arc-2" startOffset="50%">OCEAN</textPath>
        </text>
      </g>
    </svg>

    <!-- 14% Counter (Positioned below tilted 3D world map at 11.2s - 15.0s) -->
    <div id="hud-14-percent"><span id="pct-counter">0</span>%</div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["indian-ocean-map"] = tl;

    const NS = "http://www.w3.org/2000/svg";
    const projection = d3.geoEquirectangular()
      .scale(2400 / (2 * Math.PI))
      .translate([1200, 600]);
    const geoPath = d3.geoPath().projection(projection);

    // Exact Mathematical Camera Solver: Centers any (lon, lat) at zoom `scale`
    function cameraTo(lon, lat, scale) {
      const [px, py] = projection([lon, lat]);
      return {
        x: (1200 - px) * scale,
        y: (600 - py) * scale,
        scale: scale
      };
    }

    // Draw Ocean Graticule
    const graticule = d3.geoGraticule10();
    document.getElementById("graticule-path").setAttribute("d", geoPath(graticule));

    // Smooth Catmull-Rom Indian Ocean Perimeter & Underlay
    const basinLonLat = [
      [20, -34], [33, -26], [40, -11], [51, 12], [43, 13], [38, 22],
      [48, 30], [56, 26], [67, 25], [73, 21], [77, 8], [80, 10],
      [88, 22], [94, 20], [98, 8], [104, -1], [114, -8], [125, -10],
      [130, -12], [114, -22], [115, -34], [135, -35], [146, -43],
      [146, -60], [20, -60]
    ];
    const basinPixels = basinLonLat.map(pt => projection(pt));
    const smoothLine = d3.line().curve(d3.curveCatmullRomClosed.alpha(0.5));
    const basinPathStr = smoothLine(basinPixels);

    document.getElementById("basin-clip-path").setAttribute("d", basinPathStr);
    document.getElementById("basin-fill").setAttribute("d", basinPathStr);
    document.getElementById("basin-stroke").setAttribute("d", basinPathStr);

    // Build Fine Measurement Grid inside Indian Ocean Basin
    const basinGrid = document.getElementById("basin-grid");
    for (let x = 1300; x <= 2200; x += 22) {
      const l = document.createElementNS(NS, "line");
      l.setAttribute("x1", x); l.setAttribute("y1", 400);
      l.setAttribute("x2", x); l.setAttribute("y2", 1050);
      l.setAttribute("stroke", "rgba(187, 247, 208, 0.45)");
      l.setAttribute("stroke-width", "1.2");
      basinGrid.appendChild(l);
    }
    for (let y = 400; y <= 1050; y += 22) {
      const l = document.createElementNS(NS, "line");
      l.setAttribute("x1", 1300); l.setAttribute("y1", y);
      l.setAttribute("x2", 2200); l.setAttribute("y2", y);
      l.setAttribute("stroke", "rgba(187, 247, 208, 0.45)");
      l.setAttribute("stroke-width", "1.2");
      basinGrid.appendChild(l);
    }

    // Directional Motion Blur Helper
    const blurKernel = document.getElementById("blur-kernel");
    function addWhipBlur(time, duration, maxBlurX, maxBlurY) {
      const proxy = { bx: 0, by: 0 };
      tl.to(proxy, {
        bx: maxBlurX, by: maxBlurY,
        duration: duration * 0.45,
        ease: "power2.in",
        onUpdate: () => blurKernel.setAttribute("stdDeviation", `${proxy.bx.toFixed(1)},${proxy.by.toFixed(1)}`)
      }, time);
      tl.to(proxy, {
        bx: 0, by: 0,
        duration: duration * 0.55,
        ease: "power2.out",
        onUpdate: () => blurKernel.setAttribute("stdDeviation", `${proxy.bx.toFixed(1)},${proxy.by.toFixed(1)}`)
      }, time + duration * 0.45);
    }

    function buildSceneWithData(world, us) {
      const countries = topojson.feature(world, world.objects.countries).features;
      const landMesh = topojson.feature(world, world.objects.land);

      // 1. Draw Shallow Coastal Shelf Glow & All World Continents (Always Visible!)
      document.getElementById("coastal-glow-path").setAttribute("d", geoPath(landMesh));

      const countriesLayer = document.getElementById("countries-layer");
      countries.forEach(feat => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", geoPath(feat));
        p.setAttribute("fill", "url(#land-terrain-grad)");
        p.setAttribute("stroke", "rgba(16, 38, 24, 0.65)");
        p.setAttribute("stroke-width", "0.8");
        countriesLayer.appendChild(p);
      });

      // 2. Build Asia Choropleth Highlight Layer (Scene 5)
      const asianIsoCodes = new Set([
        "004","051","031","048","050","064","096","116","156","356","360","364","368",
        "376","392","400","398","414","417","418","422","458","462","496","104","524",
        "408","512","586","608","634","682","702","410","144","760","158","762","764",
        "792","795","784","860","704","887","643"
      ]);
      const asiaGroup = document.getElementById("asia-highlight-group");
      countries.forEach(feat => {
        const id = String(feat.id).padStart(3, "0");
        if (asianIsoCodes.has(id)) {
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", geoPath(feat));
          p.setAttribute("fill", "rgba(255, 196, 0, 0.22)");
          p.setAttribute("stroke", "#ffea00");
          p.setAttribute("stroke-width", "1.6");
          asiaGroup.appendChild(p);
        }
      });

      // 3. Extract ONLY Contiguous 48 US States (Excludes Alaska '02' & Hawaii '15')
      const lower48Geoms = us.objects.states.geometries.filter(
        g => g.id !== "02" && g.id !== "15" && Number(g.id) <= 56
      );
      const lower48Feature = topojson.merge(us, lower48Geoms);
      const usProjection = d3.geoAlbers().scale(195).translate([0, 0]);
      const usPathStr = d3.geoPath().projection(usProjection)(lower48Feature);

      // 7 Non-Overlapping Positions Inside the Indian Ocean Basin (Lon/Lat converted to SVG coords).
      // Kept inside a tight lon/lat window so all 7 stamps stay well within the
      // portrait viewport at the Beat 4 camera scale (no edge clipping).
      const usLonLatStamps = [
        [66, 6],   [86, 6],
        [66, -8],  [86, -8],
        [66, -22], [86, -22], [76, -33]
      ];
      const usCutoutsGroup = document.getElementById("us-cutouts-group");
      const usNodes = [];

      usLonLatStamps.forEach(([lon, lat], idx) => {
        const [cx, cy] = projection([lon, lat]);
        const g = document.createElementNS(NS, "g");
        g.setAttribute("transform", `translate(${cx}, ${cy}) scale(0)`);
        g.style.filter = "drop-shadow(0 6px 10px rgba(0,0,0,0.85))";

        const path = document.createElementNS(NS, "path");
        path.setAttribute("d", usPathStr);
        path.setAttribute("fill", "url(#us-flag-pattern)");
        path.setAttribute("stroke", "#ffffff");
        path.setAttribute("stroke-width", "1.8");

        g.appendChild(path);
        usCutoutsGroup.appendChild(g);
        usNodes.push({ el: g, x: cx, y: cy });
      });

      // =========================================================================
      // MASTER 28-SECOND SEEKABLE GSAP TIMELINE
      // =========================================================================

      // BEAT 1 (0.0s - 5.0s): Whip-Pan from Africa (25°E, 2°S) to Indian Ocean (78°E, 14°S)
      const camStart = cameraTo(25, -2, 3.1);
      const camBasinClose = cameraTo(78, -14, 3.0);
      const camBasinFull = cameraTo(78, -18, 2.35);

      tl.set("#camera-stage", { x: camStart.x, y: camStart.y, scale: camStart.scale, rotationX: 0, rotationZ: 0 }, 0);
      addWhipBlur(0.1, 1.15, 22, 6);
      tl.to("#camera-stage", {
        x: camBasinClose.x,
        y: camBasinClose.y,
        scale: camBasinClose.scale,
        duration: 1.25,
        ease: "power3.inOut"
      }, 0.1);

      // Pop in 3D Arched "INDIAN OCEAN" Title in screen center (brought in early so
      // the opening whip-pan has a subject instead of empty ocean)
      tl.fromTo("#hud-title-group",
        { opacity: 0, scale: 0.45, y: 40 },
        { opacity: 1, scale: 1, y: 0, duration: 0.65, ease: "back.out(1.7)" },
        1.15
      );
      tl.to("#hud-title-group", { opacity: 0, scale: 1.12, duration: 0.35, ease: "power2.in" }, 4.6);

      // BEAT 2 (5.0s - 11.1s): Basin Perimeter Glow + "3rd" + Measurement Grid & 70.56M Counter
      addWhipBlur(4.85, 0.65, 12, 12);
      tl.to("#camera-stage", {
        x: camBasinFull.x,
        y: camBasinFull.y,
        scale: camBasinFull.scale,
        duration: 0.7,
        ease: "power3.inOut"
      }, 4.85);

      tl.to("#basin-underlay, #basin-stroke", { opacity: 1, duration: 0.3 }, 5.05);
      tl.fromTo("#basin-stroke",
        { strokeDasharray: 2800, strokeDashoffset: 2800 },
        { strokeDashoffset: 0, duration: 1.15, ease: "power2.out" },
        5.05
      );

      tl.fromTo("#label-3rd",
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" },
        5.45
      );
      tl.to("#label-3rd", { opacity: 0, scale: 0.8, duration: 0.25 }, 7.35);

      // 7.5s: Reveal Measurement Grid & Roll Counter 0.00 -> 70.56 Million Sq. Kms
      tl.to("#basin-grid", { opacity: 1, duration: 0.4 }, 7.5);
      tl.to("#label-area", { opacity: 1, duration: 0.3 }, 7.55);

      const areaObj = { val: 0 };
      const areaEl = document.getElementById("area-counter");
      tl.to(areaObj, {
        val: 70.56,
        duration: 2.2,
        ease: "power2.out",
        onUpdate: () => { areaEl.textContent = areaObj.val.toFixed(2); }
      }, 7.6);

      // BEAT 3 (11.1s - 15.1s): 3D Tilted World Card Pullback ("Nearly 14% of Earth's Surface")
      addWhipBlur(11.0, 0.75, 20, 20);
      tl.to("#label-area, #basin-grid", { opacity: 0, duration: 0.25 }, 11.0);
      tl.to("#card-frame-border", { opacity: 1, duration: 0.3 }, 11.1);
      tl.to("#camera-stage", {
        x: 0,
        y: -260,
        scale: 0.30,
        rotationZ: -11,
        rotationX: 18,
        duration: 0.85,
        ease: "power3.inOut"
      }, 11.05);

      tl.to("#hud-14-percent", { opacity: 1, duration: 0.35 }, 11.65);
      const pctObj = { val: 0 };
      const pctEl = document.getElementById("pct-counter");
      tl.to(pctObj, {
        val: 14,
        duration: 1.4,
        ease: "power2.out",
        onUpdate: () => { pctEl.textContent = Math.round(pctObj.val); }
      }, 11.7);
      tl.to("#hud-14-percent", { opacity: 0, duration: 0.25 }, 14.8);

      // BEAT 4 (15.1s - 20.0s): Zoom Back to Indian Ocean + Stamp 7x Contiguous US Cutouts
      // Centred on the stamp cluster (lon 76, lat -12) and zoomed out so all
      // seven silhouettes plus surrounding basin stay inside the portrait frame.
      const camUSView = cameraTo(76, -12, 2.05);
      addWhipBlur(14.95, 0.75, 20, 16);
      tl.to("#card-frame-border, #basin-stroke", { opacity: 0, duration: 0.25 }, 14.95);
      tl.to("#camera-stage", {
        x: camUSView.x,
        y: camUSView.y,
        scale: camUSView.scale,
        rotationZ: 0,
        rotationX: 0,
        duration: 0.8,
        ease: "power3.inOut"
      }, 14.95);

      // Stamp all 7 Contiguous US silhouettes cleanly inside the Indian Ocean
      usNodes.forEach((n, idx) => {
        tl.fromTo(n.el,
          { attr: { transform: `translate(${n.x}, ${n.y - 30}) scale(0)` } },
          { attr: { transform: `translate(${n.x}, ${n.y}) scale(0.72)` }, duration: 0.34, ease: "back.out(1.7)" },
          15.7 + idx * 0.32
        );
      });
      tl.to("#us-cutouts-group", { opacity: 0, duration: 0.3 }, 19.8);

      // BEAT 5 (20.0s - 24.2s): Pan North to Asia + "1.5x" Neon Choropleth
      const camAsia = cameraTo(88, 32, 2.15);
      addWhipBlur(19.9, 0.7, 14, 24);
      tl.to("#camera-stage", {
        x: camAsia.x,
        y: camAsia.y,
        scale: camAsia.scale,
        duration: 0.75,
        ease: "power3.inOut"
      }, 19.9);

      tl.to("#asia-highlight-group, #label-asia-15x", { opacity: 1, duration: 0.35 }, 20.45);
      const asiaObj = { val: 0 };
      const asiaEl = document.getElementById("asia-counter");
      tl.to(asiaObj, {
        val: 1.5,
        duration: 1.45,
        ease: "power2.out",
        onUpdate: () => {
          asiaEl.textContent = (asiaObj.val >= 1.48 ? "1.5" : asiaObj.val.toFixed(2)) + "x";
        }
      }, 20.55);
      tl.to("#asia-highlight-group, #label-asia-15x", { opacity: 0, duration: 0.3 }, 23.95);

      // BEAT 6 (24.2s - 28.0s): Pan Back to Indian Ocean + Pop In 2 Vector Moons
      addWhipBlur(24.05, 0.7, 14, 24);
      // Keep the basin outline fully inside frame so the closing shot reads as a
      // complete shape rather than clipped yellow lines at the edges.
      const camMoons = cameraTo(76, -16, 1.85);
      tl.to("#basin-stroke", { opacity: 1, duration: 0.3 }, 24.3);
      tl.to("#basin-underlay", { opacity: 1, duration: 0.3 }, 24.3);
      tl.to("#camera-stage", {
        x: camMoons.x,
        y: camMoons.y,
        scale: camMoons.scale,
        duration: 0.75,
        ease: "power3.inOut"
      }, 24.05);

      tl.to("#moon-left", {
        attr: { transform: "translate(-82, 0) scale(1.35)" },
        duration: 0.55,
        ease: "back.out(1.8)"
      }, 24.95);
      tl.to("#moon-right", {
        attr: { transform: "translate(82, 0) scale(1.35)" },
        duration: 0.55,
        ease: "back.out(1.8)"
      }, 25.35);
    }

    // Load synchronously from pre-bundled window.__TOPO_DATA (in GitHub Actions) or fallback to CDN
    if (window.__TOPO_DATA) {
      buildSceneWithData(window.__TOPO_DATA.world, window.__TOPO_DATA.us);
    } else {
      Promise.all([
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json"),
        d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json")
      ]).then(([world, us]) => buildSceneWithData(world, us));
    }
  </script>
</body>
</html>
