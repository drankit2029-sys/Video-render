name: Render HyperFrames Short

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Cache pip & Kokoro model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: kokoro-deps-${{ runner.os }}-${{ hashFiles('scripts/gen_voice_kokoro.py') }}
          restore-keys: |
            kokoro-deps-${{ runner.os }}-

      - name: 4. Install System Dependencies (FFmpeg, espeak-ng, browser libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: 5. Install Python Kokoro TTS
        run: |
          pip install kokoro soundfile

      - name: 6. Generate Voiceover & Subtitles with Kokoro TTS
        run: |
          python scripts/gen_voice_kokoro.py

      - name: 7. Install HyperFrames CLI & Headless Browser
        env:
          HYPERFRAMES_NO_UPDATE_CHECK: 1
        run: |
          npm install -g hyperframes
          npx hyperframes browser ensure

      - name: 8. Lint & Render 60fps YouTube Short MP4
        env:
          HYPERFRAMES_NO_UPDATE_CHECK: 1
        run: |
          npx hyperframes lint
          npx hyperframes render --fps 60 --quality high --workers 4 --output final_short_raw.mp4

      - name: 9. Burn Professional Subtitles into Rendered Video
        run: |
          ffmpeg -y -i final_short_raw.mp4 -vf "ass=captions.ass" -c:a copy -movflags +faststart final_short.mp4

      - name: 10. Upload Rendered MP4 as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-mp4
          path: |
            final_short.mp4
            captions.ass
            captions.vtt
          retention-days: 7
