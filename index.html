<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Red Bull Strategy — Apple Glass Short</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(1200px 900px at 50% -10%, #1a1a2e 0%, #0a0a0c 60%);
    }

    /* Subtle grid texture */
    .glass-bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
    }

    /* Base clip: every scene is a glass card floating in space */
    .clip {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 860px;
      max-width: 92vw;
      padding: 44px;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(28px) saturate(1.15);
      -webkit-backdrop-filter: blur(28px) saturate(1.15);
      box-shadow: 0 24px 48px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04) inset;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }

    .clip.visible { visibility: inherit; }

    /* Kicker / badge */
    .kicker {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 24px;
      text-align: center;
    }

    /* Main title */
    .title {
      color: #ffffff;
      font-size: 56px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.8px;
      margin-bottom: 30px;
      text-align: center;
    }

    .accent { color: #ffffff; }

    /* Stat row */
    .stats {
      width: 100%;
      display: flex;
      gap: 16px;
      margin-top: 10px;
    }

    .stat {
      flex: 1;
      background: rgba(0,0,0,0.20);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 20px 16px;
      text-align: center;
    }

    .stat-value {
      display: block;
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .stat-label {
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* Audio track */
    audio { display: none; }

  </style>
</head>
<body>
  <div id="root" data-composition-id="short-video" data-width="1080" data-height="1920" data-fps="60" data-duration="15">
    <div class="glass-bg"></div>

    <audio id="voiceover" data-start="0" data-duration="15" data-track-index="0" src="voiceover.mp3"></audio>

    <!-- SCENE 1: 0s - 5s Hook -->
    <div id="scene-1" class="clip" data-start="0" data-duration="5" data-track-index="1" data-composition-id="scene-1">
      <div class="kicker">Brand Strategy</div>
      <div class="title">Red Bull spends <span class="accent">billions</span> on extreme sports.</div>
    </div>

    <!-- SCENE 2: 5s - 10s Unit Economics -->
    <div id="scene-2" class="clip" data-start="5" data-duration="5" data-track-index="1" data-composition-id="scene-2">
      <div class="kicker">Unit Economics</div>
      <div class="title">Not a <span class="accent">drink</span> company.</div>
      <div class="stats">
        <div class="stat"><span class="stat-value">$0.09</span><span class="stat-label">cost to make</span></div>
        <div class="stat"><span class="stat-value">$3.59</span><span class="stat-label">retail price</span></div>
        <div class="stat"><span class="stat-value">30%</span><span class="stat-label">adrenaline marketing</span></div>
      </div>
    </div>

    <!-- SCENE 3: 10s - 15s Payoff -->
    <div id="scene-3" class="clip" data-start="10" data-duration="5" data-track-index="1" data-composition-id="scene-3">
      <div class="kicker">The Verdict</div>
      <div class="title">You aren't buying <span class="accent">caffeine.</span><br>You're buying <span class="accent">adrenaline.</span></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};

    const easeInOut = "power3.inOut";

    // Scene 1 (0 - 5s): fade up + slight scale
    const tl1 = gsap.timeline({ paused: true });
    tl1.from("#scene-1", {
      opacity: 0, y: 40, scale: 0.96, duration: 0.9, ease: easeInOut, clearProps: "opacity,visibility"
    })
    .from("#scene-1 .kicker", { y: 18, opacity: 0, duration: 0.6, ease: "power3.out" }, "-=0.55")
    .from("#scene-1 .title", { y: 24, opacity: 0, duration: 0.7, ease: "power3.out" }, "-=0.45")
    .to("#scene-1", { opacity: 0, scale: 0.98, duration: 0.5, ease: "power2.in", clearProps: "opacity,visibility" }, 4.5);
    window.__timelines["scene-1"] = tl1;

    // Scene 2 (5 - 10s): fade up + stats stagger
    const tl2 = gsap.timeline({ paused: true });
    tl2.from("#scene-2", {
      opacity: 0, y: 40, scale: 0.96, duration: 0.9, ease: easeInOut, clearProps: "opacity,visibility"
    }, 0)
    .from("#scene-2 .kicker", { y: 18, opacity: 0, duration: 0.6, ease: "power3.out" }, "-=0.55")
    .from("#scene-2 .title", { y: 24, opacity: 0, duration: 0.7, ease: "power3.out" }, "-=0.45")
    .from("#scene-2 .stat", { y: 20, opacity: 0, duration: 0.55, ease: "power3.out", stagger: 0.12 }, "-=0.35")
    .to("#scene-2", { opacity: 0, scale: 0.98, duration: 0.5, ease: "power2.in", clearProps: "opacity,visibility" }, 4.5);
    window.__timelines["scene-2"] = tl2;

    // Scene 3 (10 - 15s): fade up + hold
    const tl3 = gsap.timeline({ paused: true });
    tl3.from("#scene-3", {
      opacity: 0, y: 40, scale: 0.96, duration: 0.9, ease: easeInOut, clearProps: "opacity,visibility"
    }, 0)
    .from("#scene-3 .kicker", { y: 18, opacity: 0, duration: 0.6, ease: "power3.out" }, "-=0.55")
    .from("#scene-3 .title", { y: 24, opacity: 0, duration: 0.7, ease: "power3.out" }, "-=0.45");
    window.__timelines["scene-3"] = tl3;
  </script>
</body>
</html>
