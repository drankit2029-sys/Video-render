<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Indian Ocean Size Comparison — Host Composition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #021a14; overflow: hidden; width: 1080px; height: 1920px; }

    /* HyperFrames Built-in Component: compositions/components/vignette.html */
    .hf-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse at 50% 50%,
        transparent 52%,
        rgba(1, 14, 10, 0.55) 82%,
        rgba(0, 8, 5, 0.92) 100%
      );
      z-index: 10;
    }

    /* HyperFrames Built-in Component: compositions/components/grain-overlay.html */
    .hf-grain-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.055;
      mix-blend-mode: overlay;
      z-index: 11;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>
  <!-- Root 1080x1920 Vertical YouTube Short Composition (28s @ 60fps) -->
  <div
    id="root"
    data-composition-id="indian-ocean-short"
    data-width="1080"
    data-height="1920"
    data-fps="60"
    data-duration="28"
    style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #021a14;">

    <!-- Track 0: Synced Edge-TTS Voiceover -->
    <audio id="voiceover" class="clip" data-start="0" data-duration="28" data-track-index="0" src="voiceover.mp3"></audio>

    <!-- Track 1: Mounted Sub-Composition Block via data-composition-src -->
    <div
      id="indian-ocean-track"
      class="clip"
      data-composition-id="indian-ocean-map"
      data-composition-src="compositions/indian-ocean-map.html"
      data-start="0"
      data-duration="28"
      data-width="1080"
      data-height="1920"
      data-track-index="1">
    </div>

    <!-- Track 2: HyperFrames Built-in Effect Components (Vignette + Film Grain) -->
    <div class="hf-vignette"></div>
    <div class="hf-grain-overlay"></div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const hostTl = gsap.timeline({ paused: true });
    window.__timelines["indian-ocean-short"] = hostTl;
  </script>
</body>
</html>
